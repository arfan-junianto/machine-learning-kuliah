name: Deploy Coursework Pages

on:
  push:
    branches: [main]
    paths:
      - "coursework/assignments/pertemuan-06/**"
      - "coursework/presentations/repository-machine-learning/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare coursework site
        run: |
          mkdir -p _site
          cp -R coursework/assignments/pertemuan-06/. _site/
          cp coursework/presentations/repository-machine-learning/Presentasi-Repository-Machine-Learning.html _site/Presentasi-Repository-Machine-Learning.html

      - name: Upload coursework site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
