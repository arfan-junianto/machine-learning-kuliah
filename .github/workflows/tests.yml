name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            coursework/projects/bab-14-breast-cancer/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r coursework/projects/bab-14-breast-cancer/requirements.txt
          python -m pip install "nbformat>=5.10,<6"
          python -m pip install "selenium>=4.52,<5"

      - name: Test notebooks and Mini Project Bab 14
        env:
          MPLCONFIGDIR: /tmp/ml-mpl
        run: |
          pytest -p no:cacheprovider coursework/assignments/pertemuan-06/tests coursework/projects/implementasi-modul-machine-learning/tests coursework/projects/bab-14-breast-cancer/tests -q
